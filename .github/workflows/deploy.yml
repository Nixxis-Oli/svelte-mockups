name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; GITHUB_TOKEN gets no more than required.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs supersede rather than cancel mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the shared package
        # The applications import it by name, so its dist/ has to exist before
        # any of them is built. Not published to a registry yet - the mockups
        # depend on it through a file: path inside this repository.
        run: |
          set -e
          cd nixxis-ui
          npm ci
          npm run build

      - name: Build the mockup
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/index.html

          for project in shadcn; do
            cd "$project-mock"
            npm ci
            # Project pages are served from /<repo>/, and each mockup from a
            # subdirectory of that.
            BASE_PATH="/${GITHUB_REPOSITORY#*/}/$project" npm run build
            cd ..
            cp -r "$project-mock/build" "_site/$project"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
