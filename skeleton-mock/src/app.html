<!doctype html>
<!-- data-theme must name a theme imported in app.css. The inline script below
	 replaces it from localStorage before first paint, so a reload does not flash
	 the default theme before the chosen one applies. -->
<html lang="en" data-theme="hamlindigo">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Runs before first paint, so a reload does not flash the default theme
			// or the default sidebar width before the stored choice applies.
			try {
				const theme = localStorage.getItem('mock-theme');
				if (theme) document.documentElement.dataset.theme = theme;

				if (localStorage.getItem('mock-mode') === 'dark') {
					document.documentElement.classList.add('dark');
				}

				const width = parseInt(localStorage.getItem('sidebar_width') || '288', 10);
				if (width >= 200 && width <= 480) {
					document.documentElement.style.setProperty('--sidebar-width', width + 'px');
				}
			} catch {
				// Private mode or blocked storage: the defaults apply.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
